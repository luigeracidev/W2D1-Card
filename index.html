<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card-W2D1</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
    <div class="card">
        <img class="img-card" src="/assets/img/Teatro-Antico-Taormina.jpg" alt="Teatro Taormina">
        <div class="overlay">
        </div>
        <button class="save-btn">
            <a href="#">Save</a>
        </button>
        <div class="btn-bottom">
            <button class="link-btn single-btn-bottom">
                <ion-icon name="arrow-up-right-box-outline"></ion-icon>
                <p>Taormina...</p>
            </button>
            <button class="send-btn single-btn-bottom">
                <ion-icon name="download"></ion-icon>
            </button>
            <button class="option-btn single-btn-bottom">
                <ion-icon name="ellipsis-horizontal-outline"></ion-icon>
            </button>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>

</html>
